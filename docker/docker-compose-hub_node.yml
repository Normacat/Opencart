services:
  chrome:
    image: selenium/node-chrome:4.40.0-20260202
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - VNC_NO_PASSWORD=1 
      - SE_NODE_MAX_SESSIONS=2

  edge:
    image: selenium/node-edge:4.40.0-20260202
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - VNC_NO_PASSWORD=1 
      - SE_NODE_MAX_SESSIONS=2

  firefox:
    image: selenium/node-firefox:4.40.0-20260202
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - VNC_NO_PASSWORD=1 
      - SE_NODE_MAX_SESSIONS=2

  selenium-hub:
    image: selenium/hub:4.40.0-20260202
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"